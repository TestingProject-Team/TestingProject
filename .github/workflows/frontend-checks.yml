name: Frontend checks (build & bundle verification)

# Chay tren MOI pull request va moi lan push vao main de kiem tra
# tinh toan ven cua ma nguon Frontend React + Vite truoc khi trien khai.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]

jobs:
  build-frontend:
    name: Build & Bundle Frontend SPA
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Upload Frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7
