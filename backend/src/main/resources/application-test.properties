# Active when the backend runs inside the Docker Compose TEST stack defined
# by docker-compose.test.yml at the repo root (SPRING_PROFILES_ACTIVE=test,
# set there). Mirrors application-docker.properties's var-driven pattern,
# but targets the "postgres-test" service name and the bookstore_test
# database/credentials, so test data never mixes with dev data.
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres-test}:${DB_PORT:5432}/${DB_NAME:bookstore_test}?sslmode=disable
spring.datasource.username=${DB_USER:bookstore_test_user}
spring.datasource.password=${DB_PASSWORD:bookstore_test_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Test DB should always start empty and be rebuilt from entities each run,
# so results are reproducible regardless of prior state.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Small pool is enough for a single-purpose test container.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2