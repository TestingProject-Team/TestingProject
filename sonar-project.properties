# SonarQube / SonarCloud Configuration for YiYi Bookstore
sonar.projectKey=TestingProject-Team_TestingProject
sonar.projectName=YiYi Bookstore
sonar.projectVersion=1.0

# Encoding
sonar.sourceEncoding=UTF-8

# Source and Test directories
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java
sonar.java.binaries=backend/target/classes

# JaCoCo Code Coverage Integration
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# Exclusions
sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,**/build/**,**/*.spec.js,**/*.test.js,e2e/**,test-scripts/**
sonar.coverage.exclusions=**/config/**,**/entity/**,**/dto/**,**/exception/**
